<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      color: #fff;
      font-family: "VT323", monospace;
      margin: 0;
      padding: 0;
    }

    main {
      padding: 2rem;
    }

    /* --- Image Gallery --- */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .gallery img {
      height: 200px; /* fixed row height */
      width: auto; /* maintain natural aspect ratio */
      object-fit: contain; /* prevents cropping */
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 0 10px rgb(129, 129, 129);
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-text">Isabella Norwood-Paulus
    </div>
    <a href="index.html" style="color:rgb(255, 255, 255); text-decoration:none;
    font-size: 1.5rem;
    ">← back</a>
  </header>

  <main>
    <div class = "pageheader">Album covers, shirt graphics, and CD inserts:
    </div>
    <div class="gallery">
      <img src="Band_stuff/EP_cover.jpg" alt="">
      <img src="Band_stuff/merch_design1.png" alt="">
      <img src="Band_stuff/bunnyshirt4.png" alt="">
      <img src="Band_stuff/CD1.png" alt="">
      <img src="Band_stuff/CD2.png" alt="">
    </div>
    <div class = "pageheader">Drawing/painting/etc:
    </div>
    <div class="gallery">
      <img src="Art_design/lion.JPEG" alt="">
      <img src="Art_design/comic1.PNG" alt="">
      <img src="Art_design/comic2.PNG" alt="">
      <img src="Art_design/tree2.jpg" alt="">
      <!-- <img src="Art_design/bed1.jpeg" alt="">
      <img src="Art_design/bed2.jpeg" alt="">
      <img src="Art_design/hands.jpg" alt="">
      <img src="Art_design/shed.JPEG" alt="">
      <img src="Art_design/churchprint.jpeg" alt="">
      <img src="Art_design/cowgun.jpeg" alt="">
      <img src="Art_design/uhh1.jpeg" alt="">
      <img src="Art_design/uhh2.jpeg" alt="">
      <img src="Art_design/city1.jpeg" alt=""> -->

    </div>
    <div class = "pageheader">More coming soon.

  </main>

  <footer>
    <p>&copy; 2025 Isabella Norwood</p>
  </footer>
</body>
</html>
